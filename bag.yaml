name: coffee
description: Keep this Mac awake — a supervised caffeinate that releases on battery

dependencies:
  - name: caffeinate
    reason: creates the IOKit power assertions that keep the display and system awake
  - name: pmset
    reason: reads the power source, and reverts disablesleep when lid-awake is enabled

tools:
  entry: tools.ts

services:
  # A manual service: whether coffee starts with the machine is a runtime
  # setting (`autostart` in coffee.json, in the bag's data directory), not a
  # property of the service. The login schedule below starts the daemon when
  # autostart is on; `barry coffee on` starts it otherwise. The daemon re-reads
  # config every poll, so toggles take effect without a restart.
  #
  # The shell scripts live in `scripts/`, not the conventional `bin/`: the repo
  # .gitignore has a global `bin/` rule (build output), which silently left both
  # of these untracked — a bag whose daemon does not exist on a fresh clone.
  daemon:
    description: Holds a caffeinate assertion while enabled and running on AC power
    command: /bin/bash
    args: ["scripts/coffee-supervisor"]
    working-directory: .
    autostart: manual

schedules:
  # Once per login. Covers the one case the daemon's EXIT trap cannot: a kill -9
  # or power loss that leaves `pmset disablesleep 1` set system-wide. Without
  # this, a dirty death means the Mac silently cannot sleep until somebody
  # notices and reverts it by hand. It also starts the daemon when autostart is
  # on.
  reconcile:
    at: login
    action:
      description: Clear an orphaned disablesleep left by a dirty shutdown, and start coffee on autostart
      run:
        command: /bin/bash
        args: ["scripts/coffee-reconcile"]
      timeout: 1m
